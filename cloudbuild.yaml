# PROTECTED BUILD for cyber-cms-poc-1: build + push only, never deploys.
# The build prerenders pages from Turso, so it needs the two database secrets. They are read from
# Secret Manager by the dedicated build identity and reach Docker only as a BuildKit secret mount
# (never ARG/ENV, never a layer, never the source upload). R2 keys and the Payload secret are NOT
# given to the build: placeholders satisfy the configuration check and are discarded.
# The env file lives on the step container's in-memory /dev/shm and vanishes with the step.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'protected-build'
    entrypoint: 'bash'
    secretEnv: ['BUILD_DATABASE_URL', 'BUILD_DATABASE_AUTH_TOKEN']
    args:
      - '-c'
      - |
          set -euo pipefail
          set +x
          export DOCKER_BUILDKIT=1
          umask 077
          f="$$(mktemp -p /dev/shm app_env.XXXXXX)"
          printf '%s\n' 'APP_ENV=preview' 'DATABASE_KIND=turso' 'MEDIA_STORAGE=r2' >> "$$f"
          printf '%s\n' 'DATABASE_TARGET_HOST=web-factory-v2-poc-db-tonystark.aws-ap-southeast-1.turso.io' >> "$$f"
          printf '%s\n' 'R2_BUCKET=stark-web-factory-poc-media' 'R2_TARGET_BUCKET=stark-web-factory-poc-media' >> "$$f"
          printf '%s\n' 'R2_ENDPOINT=https://8c89b00536833536339bc5053558573e.r2.cloudflarestorage.com' >> "$$f"
          printf '%s\n' 'R2_PUBLIC_URL=https://pub-7e1de38ab9a24e19891a4da10f70e3a0.r2.dev' 'R2_PREFIX=stark-poc' >> "$$f"
          printf 'DATABASE_URL=%s\n' "$$BUILD_DATABASE_URL" >> "$$f"
          printf 'DATABASE_AUTH_TOKEN=%s\n' "$$BUILD_DATABASE_AUTH_TOKEN" >> "$$f"
          printf 'PAYLOAD_SECRET=%s\n' "$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$$f"
          printf '%s\n' 'R2_ACCESS_KEY_ID=build-placeholder-not-a-credential' 'R2_SECRET_ACCESS_KEY=build-placeholder-not-a-credential' >> "$$f"
          docker build --pull --secret id=app_env,src="$$f" -f Dockerfile -t "${_IMAGE}:${_PRODUCT_SHA}-$BUILD_ID" .
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', '${_IMAGE}:${_PRODUCT_SHA}-$BUILD_ID']
images: ['${_IMAGE}:${_PRODUCT_SHA}-$BUILD_ID']
substitutions:
  _IMAGE: 'INVALID-IMAGE-OVERRIDE-REQUIRED'
  _PRODUCT_SHA: 'INVALID-SHA-OVERRIDE-REQUIRED'
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/cyber-cms-poc-1-database-url/versions/1'
      env: 'BUILD_DATABASE_URL'
    - versionName: 'projects/$PROJECT_ID/secrets/cyber-cms-poc-1-database-auth-token/versions/1'
      env: 'BUILD_DATABASE_AUTH_TOKEN'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
